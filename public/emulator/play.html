<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fliperama</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        height: 100dvh;
        background: #0e1118;
        color: #f7f3ea;
        font-family: ui-sans-serif, system-ui, sans-serif;
        touch-action: manipulation;
      }
      #wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      #display {
        flex: 1;
        min-height: 0;
      }
      #watch-shield {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 16px;
        background: transparent;
        color: #9aa4b8;
        font-size: 13px;
        pointer-events: auto;
      }
      #watch-shield[hidden] {
        display: none;
      }
      #boot {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #0e1118;
        z-index: 2;
      }
      #boot.hidden {
        display: none;
      }
      button {
        font: inherit;
        padding: 10px 16px;
        border-radius: 8px;
        border: 1px solid #4c5d82;
        background: #1c212c;
        color: inherit;
        cursor: pointer;
      }
      #status {
        font-size: 13px;
        color: #9aa4b8;
        max-width: 28rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="display"></div>
      <div id="watch-shield" hidden>A assistir — o teclado não controla o jogo</div>
    </div>
    <div id="boot">
      <div id="status">A carregar o fliperama…</div>
      <button id="start" type="button" hidden>Começar</button>
    </div>
    <script>
      (function () {
      const boot = document.querySelector('#boot');
      const status = document.querySelector('#status');
      const start = document.querySelector('#start');
      let session = null;
      let started = false;
      let joiningNetplay = false;

      // EmulatorJS mute/slider only touches RetroArch OpenAL. Netplay guests hear a
      // separate WebRTC <audio> (and often a second Web Audio graph). Hook speakers
      // + those elements so the same control actually silences the game.
      installOfficeVolume();

      window.addEventListener('message', (event) => {
        if (event.origin !== window.location.origin) return;
        const data = event.data;
        if (!data || data.type !== 'office-emulator-config' || !data.config) return;
        session = data.config;
        if (started) {
          if ((session.role === 'guest' || session.role === 'spectator') && session.netplayRoomId) {
            void joinWhenReady(session);
          }
          return;
        }
        status.textContent =
          session.role === 'spectator'
            ? `${session.gameName} · a assistir`
            : `${session.gameName} · você é Player ${session.playerNumber}`;
        void beginPlay();
      });

      start.addEventListener('click', () => void beginPlay());

      parent.postMessage({ type: 'office-emulator-ready' }, window.location.origin);

      function installOfficeVolume() {
        const masters = [];

        function emuVolumeLevel() {
          const emu = window.EJS_emulator;
          if (!emu) return 1;
          if (emu.muted) return 0;
          if (typeof emu.volume === 'number' && Number.isFinite(emu.volume)) {
            return Math.max(0, Math.min(1, emu.volume));
          }
          return 1;
        }

        function isNetplayGuest(emu) {
          return Boolean(emu && emu.isNetplay && emu.netplay && !emu.netplay.owner);
        }

        function applyToAudio(el) {
          if (!(el instanceof HTMLAudioElement)) return;
          const level = emuVolumeLevel();
          try {
            el.volume = level;
            el.muted = level <= 0;
          } catch {
            /* ignore */
          }
        }

        function applyOfficeVolume() {
          const level = emuVolumeLevel();
          const np = window.EJS_emulator && window.EJS_emulator.netplay;
          if (np && np._remoteAudioGain) {
            try {
              np._remoteAudioGain.gain.value = Number(np._audioBoostFactor) || 1;
            } catch {
              /* ignore */
            }
          }
          for (let i = 0; i < masters.length; i += 1) {
            try {
              masters[i].gain.value = level;
            } catch {
              /* context closed */
            }
          }
          document.querySelectorAll('audio').forEach(applyToAudio);
        }

        function neutralizeAlGains(emu) {
          try {
            const ctx = emu.Module && emu.Module.AL && emu.Module.AL.currentCtx;
            if (!ctx || !ctx.sources) return;
            ctx.sources.forEach((source) => {
              if (source && source.gain && source.gain.gain) source.gain.gain.value = 1;
            });
          } catch {
            /* ignore */
          }
        }

        function hookSetVolume() {
          const emu = window.EJS_emulator;
          if (!emu || typeof emu.setVolume !== 'function' || emu._officeVolumeHook) {
            return Boolean(emu && emu._officeVolumeHook);
          }
          emu._officeVolumeHook = true;
          const orig = emu.setVolume.bind(emu);
          emu.setVolume = (volume) => {
            const result = orig(volume);
            if (!isNetplayGuest(emu)) neutralizeAlGains(emu);
            applyOfficeVolume();
            return result;
          };
          applyOfficeVolume();
          return true;
        }

        const nodeProto = window.AudioNode && window.AudioNode.prototype;
        if (nodeProto && !nodeProto._officeVolumeHook && typeof nodeProto.connect === 'function') {
          nodeProto._officeVolumeHook = true;
          const origConnect = nodeProto.connect;
          nodeProto.connect = function () {
            try {
              const ctx = this.context;
              const dest = arguments[0];
              if (ctx && dest === ctx.destination) {
                if (!ctx._officeMaster) {
                  ctx._officeMaster = ctx.createGain();
                  ctx._officeMaster.gain.value = emuVolumeLevel();
                  origConnect.call(ctx._officeMaster, ctx.destination);
                  masters.push(ctx._officeMaster);
                }
                if (this !== ctx._officeMaster) {
                  const args = Array.prototype.slice.call(arguments);
                  args[0] = ctx._officeMaster;
                  return origConnect.apply(this, args);
                }
              }
            } catch {
              /* fall through */
            }
            return origConnect.apply(this, arguments);
          };
        }

        const mediaProto = window.HTMLMediaElement && window.HTMLMediaElement.prototype;
        if (mediaProto && !mediaProto._officeVolumeHook && typeof mediaProto.play === 'function') {
          mediaProto._officeVolumeHook = true;
          const origPlay = mediaProto.play;
          mediaProto.play = function () {
            applyToAudio(this);
            return origPlay.apply(this, arguments);
          };
        }

        const observer = new MutationObserver((records) => {
          for (let i = 0; i < records.length; i += 1) {
            const nodes = records[i].addedNodes;
            for (let j = 0; j < nodes.length; j += 1) {
              const node = nodes[j];
              if (node instanceof HTMLAudioElement) applyToAudio(node);
              if (node instanceof HTMLElement) node.querySelectorAll('audio').forEach(applyToAudio);
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
        document.addEventListener('pointerdown', applyOfficeVolume, true);
        window.setInterval(() => {
          hookSetVolume();
          applyOfficeVolume();
        }, 400);
      }

      function beginPlay() {
        if (!session || started) return;
        started = true;
        start.hidden = true;
        status.textContent = 'A carregar o EmulatorJS…';
        void bootEmulator(session);
      }

      async function bootEmulator(cfg) {
        const snesCoreCdn = 'https://cdn.emulatorjs.org/4.3.0-pre/data/';
        const candidates = uniqueCdns(
          cfg.multitap
            ? [snesCoreCdn, 'https://cdn.emulatorjs.org/nightly/data/', cfg.ejsCdn]
            : [cfg.ejsCdn, 'https://cdn.emulatorjs.org/latest/data/', snesCoreCdn],
        );
        window.EJS_player = '#display';
        window.EJS_core = cfg.core;
        window.EJS_gameName = cfg.gameName;
        window.EJS_gameUrl = cfg.romUrl;
        window.EJS_gameID = cfg.ejsGameId;
        window.EJS_color = '#4c5d82';
        window.EJS_startOnLoaded = true;
        window.EJS_Buttons = {
          netplay: cfg.role !== 'spectator',
          playPause: true,
          restart: cfg.role !== 'spectator',
          mute: true,
          settings: true,
          fullscreen: true,
        };
        const netplayUrl = (cfg.netplayServer || defaultNetplayServer(cfg)).replace(/\/$/, '');
        window.EJS_netplayServer = netplayUrl;
        window.EJS_netplayUrl = netplayUrl;
        window.EJS_netplayICEServers = cfg.iceServers;
        window.EJS_multitap = Boolean(cfg.multitap);
        if (cfg.multitap) {
          const coreBase = `${snesCoreCdn}cores/`;
          const paths = Object.assign({}, window.EJS_paths);
          [
            'snes9x-wasm.data',
            'snes9x-legacy-wasm.data',
            'snes9x-thread-wasm.data',
            'snes9x-thread-legacy-wasm.data',
          ].forEach((name) => {
            paths[name] = coreBase + name;
          });
          window.EJS_paths = paths;
        }
        window.EJS_ready = () => {
          if (cfg.multitap) armSnesMultitap(window.EJS_emulator);
        };
        window.EJS_onGameStart = () => {
          const applyMultitap = () => {
            try {
              if (cfg.multitap) enableSnesMultitap(window.EJS_emulator);
            } catch {
              /* core sem Super Multitap no WASM — o Netplay tem de abrir na mesma */
            }
          };
          applyMultitap();
          window.setTimeout(applyMultitap, 300);
          parent.postMessage({ type: 'office-emulator-playing' }, window.location.origin);
          void bootNetplay(cfg);
        };

        let loaded = null;
        for (const cdn of candidates) {
          window.EJS_pathtodata = cdn;
          try {
            await loadLoader(cdn);
            loaded = cdn;
            break;
          } catch {
            /* tenta o próximo mirror */
          }
        }
        if (!loaded) {
          started = false;
          start.hidden = false;
          start.textContent = 'Tentar de novo';
          status.textContent =
            'Não deu para carregar o EmulatorJS (CDN). Confira a rede ou EJS_CDN=https://cdn.emulatorjs.org/latest/data/';
          return;
        }
        boot.classList.add('hidden');
        if (cfg.role === 'spectator') enableWatchShield();
        void waitFor(() => window.EJS_emulator, 20000).then((emu) => {
          if (cfg.multitap) armSnesMultitap(emu);
        });
      }

      function uniqueCdns(urls) {
        const seen = new Set();
        const next = [];
        for (const raw of urls) {
          if (typeof raw !== 'string' || raw.length === 0) continue;
          const cdn = raw.endsWith('/') ? raw : `${raw}/`;
          if (seen.has(cdn)) continue;
          seen.add(cdn);
          next.push(cdn);
        }
        return next;
      }

      function loadLoader(cdn) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `${cdn}loader.js`;
          script.onload = () => resolve(cdn);
          script.onerror = () => {
            script.remove();
            reject(new Error(script.src));
          };
          document.body.append(script);
        });
      }

      async function bootNetplay(cfg) {
        const emu = await waitFor(() => window.EJS_emulator, 20000);
        if (!emu) {
          showNetplayHint('EmulatorJS não subiu.');
          return;
        }
        try {
          if (cfg.multitap) enableSnesMultitap(emu);
        } catch {
          /* opcional */
        }
        const np = await waitFor(() => netplayApi(emu), 8000);
        if (!np) {
          showNetplayHint('Netplay indisponível nesta build — o jogo local continua.');
          return;
        }
        try {
          await ensureSocketIo();
        } catch {
          showNetplayHint('Socket.IO não carregou. O jogo local continua.');
          return;
        }
        const server = (cfg.netplayServer || defaultNetplayServer(cfg)).replace(/\/$/, '');
        np.url = server;
        if (emu.config) emu.config.netplayUrl = server;
        if (typeof np.defineNetplayFunctions === 'function') {
          try {
            np.defineNetplayFunctions();
          } catch {
            /* hook opcional */
          }
        }
        np.name = cfg.playerName;
        if (cfg.role === 'host') {
          np.openRoom(cfg.netplayRoomName, cfg.playerCount, cfg.netplayPassword);
          const roomId = await waitFor(() => (emu.isNetplay && np.extra && np.extra.sessionid) || null, 15000);
          if (typeof roomId === 'string') {
            parent.postMessage({ type: 'office-emulator-room', roomId }, window.location.origin);
          } else {
            showNetplayHint(`Sala Netplay não abriu em ${server}. O jogo local continua.`);
          }
          reportSlot(np, cfg);
          return;
        }
        if (cfg.netplayRoomId) {
          await joinWhenReady(cfg);
          return;
        }
        parent.postMessage({ type: 'office-emulator-need-room' }, window.location.origin);
      }

      async function joinWhenReady(cfg) {
        const emu = window.EJS_emulator;
        const np = netplayApi(emu);
        if (!np || !cfg.netplayRoomId) {
          parent.postMessage({ type: 'office-emulator-need-room' }, window.location.origin);
          return;
        }
        if (emu.isNetplay && np.extra && np.extra.sessionid === cfg.netplayRoomId) {
          reportSlot(np, cfg);
          return;
        }
        if (joiningNetplay) return;
        joiningNetplay = true;
        np.name = cfg.playerName;
        np.joinRoom(cfg.netplayRoomId, cfg.netplayRoomName, cfg.playerCount, cfg.netplayPassword);
        const joined = await waitFor(() => emu.isNetplay, 12000);
        if (joined) {
          reportSlot(np, cfg);
          return;
        }
        joiningNetplay = false;
        showNetplayHint('Ainda a entrar na sala Netplay…');
      }

      function netplayApi(emu) {
        if (!emu) return null;
        const np = emu.netplay;
        if (np && typeof np.openRoom === 'function' && typeof np.joinRoom === 'function') return np;
        if (typeof emu.netplayOpenRoom === 'function' && typeof emu.netplayJoinRoom === 'function') {
          return {
            openRoom: (rn, mp, pw) => emu.netplayOpenRoom(rn, mp, pw),
            joinRoom: (sid, rn, mp, pw) => emu.netplayJoinRoom(sid, rn, mp, pw),
            getUserIndex: () => (typeof emu.netplayGetUserIndex === 'function' ? emu.netplayGetUserIndex() : 0),
            extra: emu.netplay && emu.netplay.extra,
            get name() {
              return emu.netplay && emu.netplay.name;
            },
            set name(value) {
              emu.netplay = emu.netplay || {};
              emu.netplay.name = value;
            },
            get url() {
              return emu.netplay && emu.netplay.url;
            },
            set url(value) {
              emu.netplay = emu.netplay || {};
              emu.netplay.url = value;
            },
            defineNetplayFunctions: () => emu.defineNetplayFunctions && emu.defineNetplayFunctions(),
          };
        }
        return null;
      }

      function reportSlot(np, cfg) {
        if (cfg.role === 'spectator') {
          parent.postMessage(
            { type: 'office-emulator-slot', index: -1, expected: -1, message: 'A assistir' },
            window.location.origin,
          );
          return;
        }
        const index = typeof np.getUserIndex === 'function' ? np.getUserIndex() : cfg.role === 'host' ? 0 : 1;
        parent.postMessage(
          { type: 'office-emulator-slot', index, expected: cfg.playerNumber - 1 },
          window.location.origin,
        );
      }

      function enableWatchShield() {
        const shield = document.querySelector('#watch-shield');
        if (!(shield instanceof HTMLElement)) return;
        shield.hidden = false;
        shield.tabIndex = 0;
        shield.focus();
        const block = (event) => {
          event.preventDefault();
          event.stopPropagation();
        };
        window.addEventListener('keydown', block, true);
        window.addEventListener('keyup', block, true);
      }

      function showNetplayHint(message) {
        parent.postMessage({ type: 'office-emulator-slot', index: -1, expected: 0, message }, window.location.origin);
      }

      function ensureSocketIo() {
        if (typeof window.io === 'function') return Promise.resolve();
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.socket.io/4.8.1/socket.io.min.js';
          script.onload = () => resolve();
          script.onerror = () => reject(new Error('socket.io'));
          document.head.append(script);
        });
      }

      /** libretro `RETRO_DEVICE_JOYPAD_MULTITAP` — Super Multitap on SNES port 2. */
      const SNES_MULTITAP_DEVICE = 257;
      const MULTITAP_APPEND = '/tmp/office-multitap.cfg';
      const RETROARCH_CFGS = [
        '/retroarch/userdata/retroarch.cfg',
        '/home/web_user/retroarch/userdata/retroarch.cfg',
        '/home/web_user/.config/retroarch/retroarch.cfg',
        '/home/web_user/.retroarch.cfg',
        '/etc/retroarch.cfg',
      ];
      const RETROARCH_REMAPS = [
        '/retroarch/userdata/config/remaps/Snes9x/Snes9x.rmp',
        '/retroarch/userdata/config/remaps/snes9x/snes9x.rmp',
        '/home/web_user/retroarch/userdata/config/remaps/Snes9x/Snes9x.rmp',
        '/home/web_user/.config/retroarch/config/remaps/Snes9x/Snes9x.rmp',
      ];

      function multitapCfgBody() {
        return [
          'input_max_users = "8"',
          'input_libretro_device_p1 = "1"',
          `input_libretro_device_p2 = "${SNES_MULTITAP_DEVICE}"`,
          'input_libretro_device_p3 = "1"',
          'input_libretro_device_p4 = "1"',
          'input_libretro_device_p5 = "1"',
          '',
        ].join('\n');
      }

      function mergeMultitapIntoCfg(text) {
        let next = typeof text === 'string' ? text : '';
        const settings = {
          input_max_users: '"8"',
          input_libretro_device_p1: '"1"',
          input_libretro_device_p2: `"${SNES_MULTITAP_DEVICE}"`,
          input_libretro_device_p3: '"1"',
          input_libretro_device_p4: '"1"',
          input_libretro_device_p5: '"1"',
        };
        Object.keys(settings).forEach((key) => {
          const line = `${key} = ${settings[key]}`;
          const re = new RegExp(`${key}\\s*=\\s*("[^"]*"|\\S+)`);
          if (re.test(next)) next = next.replace(re, line);
          else next = `${next.replace(/\s*$/, '')}\n${line}\n`;
        });
        return next;
      }

      function emulatorFs(emu) {
        if (emu && emu.Module && emu.Module.FS) return emu.Module.FS;
        if (emu && emu.gameManager && emu.gameManager.FS) return emu.gameManager.FS;
        if (emu && emu.gameManager && emu.gameManager.Module && emu.gameManager.Module.FS) {
          return emu.gameManager.Module.FS;
        }
        return null;
      }

      function fsWrite(fs, path, text) {
        const parts = path.split('/');
        let current = '';
        for (let i = 0; i < parts.length - 1; i += 1) {
          if (!parts[i]) continue;
          current += `/${parts[i]}`;
          try {
            fs.mkdir(current);
          } catch {
            /* já existe */
          }
        }
        fs.writeFile(path, text);
      }

      function writeSnesMultitapCfg(emu) {
        const fs = emulatorFs(emu);
        if (!fs || typeof fs.writeFile !== 'function') return false;
        const body = multitapCfgBody();
        try {
          fsWrite(fs, MULTITAP_APPEND, body);
        } catch {
          return false;
        }
        RETROARCH_CFGS.forEach((path) => {
          let prev = '';
          try {
            prev = String(fs.readFile(path, { encoding: 'utf8' }));
          } catch {
            prev = '';
          }
          try {
            fsWrite(fs, path, mergeMultitapIntoCfg(prev));
          } catch {
            /* ignore */
          }
        });
        RETROARCH_REMAPS.forEach((path) => {
          try {
            fsWrite(fs, path, body);
          } catch {
            /* ignore */
          }
        });
        return true;
      }

      function hookFsWrites(emu) {
        const fs = emulatorFs(emu);
        if (!fs || typeof fs.writeFile !== 'function' || fs._officeMultitapFs) return false;
        const orig = fs.writeFile.bind(fs);
        fs._officeMultitapFs = true;
        fs.writeFile = function (path, data, opts) {
          const name = String(path || '');
          let payload = data;
          if (/retroarch\.cfg$/i.test(name)) {
            let text = '';
            if (typeof data === 'string') text = data;
            else if (data instanceof Uint8Array) text = new TextDecoder().decode(data);
            payload = mergeMultitapIntoCfg(text);
          }
          return orig(path, payload, opts);
        };
        return true;
      }

      function hookRetroArchCallMain(emu) {
        const mod = (emu && emu.Module) || (emu && emu.gameManager && emu.gameManager.Module);
        if (!mod || typeof mod.callMain !== 'function' || mod._officeMultitapMain) return false;
        hookFsWrites(emu);
        if (!writeSnesMultitapCfg(emu)) return false;
        mod._officeMultitapMain = true;
        const orig = mod.callMain.bind(mod);
        mod.callMain = function (args) {
          writeSnesMultitapCfg(emu);
          const extra = [`--appendconfig=${MULTITAP_APPEND}`];
          const list = Array.isArray(args) ? extra.concat(args) : extra;
          return orig(list);
        };
        return true;
      }

      function watchEmulatorModule(emu) {
        if (!emu || emu._officeMultitapWatch) return;
        emu._officeMultitapWatch = true;
        let current = emu.Module;
        const apply = () => {
          hookFsWrites(emu);
          hookRetroArchCallMain(emu);
        };
        if (current) apply();
        try {
          Object.defineProperty(emu, 'Module', {
            configurable: true,
            enumerable: true,
            get() {
              return current;
            },
            set(mod) {
              current = mod;
              apply();
            },
          });
        } catch {
          /* Module já definido — o poll do armSnesMultitap chega */
        }
      }

      function armSnesMultitap(emu) {
        if (!emu || emu._officeMultitapArmed) return;
        emu._officeMultitapArmed = true;
        watchEmulatorModule(emu);
        if (typeof emu.on === 'function') {
          emu.on('saveDatabaseLoaded', () => hookRetroArchCallMain(emu));
        }
        const startedAt = Date.now();
        const tick = () => {
          hookFsWrites(emu);
          if (hookRetroArchCallMain(emu)) return;
          if (Date.now() - startedAt > 45000) return;
          requestAnimationFrame(tick);
        };
        tick();
      }

      function enableSnesMultitap(emu) {
        writeSnesMultitapCfg(emu);
        const gm = emu && emu.gameManager;
        const nativeSet = gm && gm.functions && gm.functions.setControllerPortDevice;
        const wasmSet =
          emu && emu.Module && typeof emu.Module._ejs_set_controller_port_device === 'function'
            ? (port, device) => emu.Module._ejs_set_controller_port_device(port, device)
            : null;
        const setDevice = typeof nativeSet === 'function' ? nativeSet.bind(gm.functions) : wasmSet;
        if (typeof setDevice !== 'function') return false;
        let deviceId = SNES_MULTITAP_DEVICE;
        try {
          const nativeInfo = gm && gm.functions && gm.functions.getControllerPortInfo;
          const info = typeof nativeInfo === 'function' ? nativeInfo() : '';
          if (typeof info === 'string') {
            for (const line of info.split('\n')) {
              const parts = line.split(':');
              if (parts.length < 3 || parts[0] !== '1') continue;
              if (!/multitap/i.test(parts.slice(2).join(':'))) continue;
              const parsed = Number(parts[1]);
              if (Number.isFinite(parsed)) {
                deviceId = parsed;
                break;
              }
            }
          }
        } catch {
          /* WASM antigo sem a export */
        }
        try {
          setDevice(1, deviceId);
          return true;
        } catch {
          return false;
        }
      }

      function defaultNetplayServer(cfg) {
        const pagePort = Number(location.port);
        if (pagePort === 5173 || pagePort === 4173) return location.origin;
        const port = Number(cfg && cfg.netplayPort) || 3000;
        return `${location.protocol}//${location.hostname}:${port}`;
      }

      function waitFor(probe, timeout) {
        const startedAt = Date.now();
        return new Promise((resolve) => {
          const tick = () => {
            const value = probe();
            if (value) {
              resolve(value);
              return;
            }
            if (Date.now() - startedAt > timeout) {
              resolve(null);
              return;
            }
            requestAnimationFrame(tick);
          };
          tick();
        });
      }
      })();
    </script>
  </body>
</html>
